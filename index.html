<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>חומרי למידה — עתיד פלוס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* ====== צבע המותג — להחליף כאן כשמגיע הלוגו ====== */
  --navy:#262661;        /* כחול המותג */
  --teal:#1CA79C;        /* טורקיז המותג */
  --green:#3BB54C;       /* ירוק המותג */
  --accent:#262661;
  --accent-ink:#262661;
  --accent-wash:rgba(38,38,97,.07);
  /* ================================================= */
  --ink:#17181A; --ink2:#5B6069; --ink3:#8A9099;
  --surface:#fff; --sunken:#EFF1F5; --hairline:#E3E5EA;
  --warn:#B06A12;
  --inset:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Assistant',system-ui,sans-serif;
  background:var(--sunken); color:var(--ink);
  letter-spacing:0; -webkit-font-smoothing:antialiased;
  font-size:17px; line-height:1.6;
}
.app{max-width:640px;margin:0 auto;background:var(--sunken);min-height:100vh;
     padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
       text-align:start;letter-spacing:0}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- navbar ---------- */
nav{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;
    display:flex;align-items:center;gap:8px;padding:0 var(--inset);
    height:calc(52px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top)}
nav .back{display:flex;align-items:center;gap:4px;color:#fff;
          font-size:17px;font-weight:500;margin-inline-start:-6px;padding:6px;opacity:.95}
nav .back svg{width:11px;height:18px}
nav .t{font-size:17px;font-weight:600;flex:1;min-width:0;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap;opacity:.95}
nav .lgm{height:22px;margin-inline-start:auto;opacity:.9}

/* ---------- headers ---------- */
.hero{background:var(--navy);color:#fff;padding:calc(28px + env(safe-area-inset-top)) var(--inset) 28px}
.hero img{height:52px;display:block;margin-bottom:22px}
.hero h1{font-size:30px;line-height:38px;font-weight:700;margin:0}
.hero p{font-size:15px;line-height:22px;margin:6px 0 0;opacity:.72}
.lg{padding:22px var(--inset) 10px;background:var(--surface)}
.lg h1{font-size:28px;line-height:36px;font-weight:700;margin:0}
.lg p{font-size:14px;line-height:20px;color:var(--ink2);margin:4px 0 0}

/* ---------- list ---------- */
.list{background:var(--surface);border-top:1px solid var(--hairline)}
.pad{height:28px;background:var(--sunken)}
.sect{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:20;
      background:var(--sunken);border-bottom:1px solid var(--hairline);
      border-top:1px solid var(--hairline);
      display:flex;align-items:baseline;gap:8px;
      padding:8px var(--inset) 7px;margin-top:0}
.sect:first-child{border-top:0}
.sect b{font-size:13px;line-height:20px;font-weight:700;color:var(--ink2);letter-spacing:0}
.sect span{font-size:13px;color:var(--ink3);margin-inline-start:auto}
.row{display:flex;align-items:center;gap:12px;width:100%;
     padding:12px 0 12px var(--inset);padding-inline-start:var(--inset);
     position:relative;transition:background .12s}
.row:active{background:rgba(0,0,0,.04)}
.row::after{content:"";position:absolute;bottom:0;inset-inline-start:var(--inset);
            inset-inline-end:0;height:1px;background:var(--hairline)}
.row:last-child::after{display:none}
.row .tx{flex:1;min-width:0}
.row .p1{display:block;font-size:17px;line-height:24px;font-weight:500}
.row .p2{display:block;font-size:14px;line-height:20px;color:var(--ink2);margin-top:4px}
.row .p2 .w{color:var(--warn);font-weight:500}
.row .chev{flex:0 0 auto;color:var(--ink3);margin-inline-end:4px}
.row .chev svg{width:9px;height:15px;display:block}
.row[disabled]{opacity:.45}
.row[disabled]:active{background:none}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;
     background:var(--warn);vertical-align:middle;margin-inline-end:7px}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px var(--inset);background:var(--surface)}
.chip{height:36px;padding:0 14px;border-radius:8px;background:#EFF0F3;
      color:var(--ink2);font-size:14px;font-weight:600;
      display:inline-flex;align-items:center;transition:background .12s}
.chip.on{background:var(--accent);color:#fff}
.chips.lvl{padding-top:0}
.chips.lvl .chip{font-weight:500}

/* ---------- search ---------- */
.srch{padding:0 var(--inset) 14px;background:var(--surface)}
.srch input{width:100%;height:40px;border:0;border-radius:10px;background:#EFF0F3;
            padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
.srch input::placeholder{color:var(--ink3)}
.srch input:focus{outline:2px solid var(--accent-wash);background:#fff;
                  box-shadow:inset 0 0 0 1px var(--hairline)}

/* ---------- detail ---------- */
.det{padding:20px var(--inset) 28px;background:var(--surface)}
.eyebrow{font-size:14px;line-height:20px;font-weight:600;color:var(--ink2)}
.eyebrow.warn{color:var(--warn)}
.det h2{font-family:'Frank Ruhl Libre',serif;font-weight:600;
        font-size:26px;line-height:34px;margin:6px 0 0}
.meta{font-size:14px;line-height:20px;color:var(--ink2);margin-top:6px}
.subtle{font-size:15px;line-height:24px;color:var(--ink2);margin-top:8px}
section.blk{margin-top:28px;padding-top:0}
section.blk h3{font-size:17px;line-height:24px;font-weight:600;margin:0 0 8px;
               padding-top:16px;border-top:1px solid var(--hairline)}
section.blk p{font-size:17px;line-height:29px;margin:0 0 12px}
section.blk p:last-child{margin-bottom:0}
ol.chk{list-style:none;margin:0;padding:0}
ol.chk li{position:relative;padding-inline-start:24px;font-size:17px;
          line-height:27px;margin-bottom:10px}
ol.chk li b{position:absolute;inset-inline-start:0;top:0;color:var(--accent-ink);
            font-size:15px;font-weight:600}
.vid{text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px;width:100%;height:56px;
     margin-top:28px;border-top:1px solid var(--hairline);transition:background .12s}
.vid:active{background:rgba(0,0,0,.04)}
.vid.bkrow{border-top:0}
.vid .pl.bk{background:var(--navy);border-radius:6px;font-size:9px}
.vid .pl{width:28px;height:28px;border-radius:50%;background:var(--teal);
         color:#fff;display:flex;align-items:center;justify-content:center;
         flex:0 0 28px;font-size:11px;padding-inline-start:2px}
.vid .vt{flex:1;min-width:0}
.vid .vt b{display:block;font-size:17px;font-weight:500;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
.vid .vt span{font-size:14px;color:var(--ink2)}
.rep{display:flex;align-items:center;gap:10px;width:100%;height:50px;margin-top:28px;
     border-top:1px solid var(--hairline);color:var(--ink2);font-size:15px;
     text-decoration:none;transition:background .12s}
.rep:active{background:rgba(0,0,0,.04)}
.rep .chev{margin-inline-start:auto;color:var(--ink3)}
.rep .chev svg{width:9px;height:15px;display:block}
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;
       justify-content:center;background:rgba(23,24,26,.32)}
.sheet.on{display:flex}
.sheet .bx{background:#fff;width:100%;max-width:640px;border-radius:14px 14px 0 0;
    padding:24px var(--inset) calc(24px + env(safe-area-inset-bottom))}
.sheet h4{margin:0 0 6px;font-size:19px;font-weight:600}
.sheet p{margin:0 0 16px;font-size:15px;line-height:23px;color:var(--ink2)}
.sheet a.go,.sheet button.cl{display:block;width:100%;height:48px;border-radius:10px;
    font-size:17px;font-weight:600;text-align:center;line-height:48px;text-decoration:none}
.sheet a.go{background:var(--navy);color:#fff;margin-bottom:8px}
.sheet button.cl{background:#EFF0F3;color:var(--ink)}
.acc{font-size:13px;line-height:20px;color:var(--ink3);padding:8px 0 0}
.acc a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid rgba(38,38,97,.25)}
.acc .na{color:var(--warn)}
/* שלושת החלקים */
.part{margin-top:30px}
.part>.hd{display:flex;align-items:baseline;gap:10px;padding-top:16px;
          border-top:1px solid var(--hairline);margin-bottom:4px}
.part>.hd .n{flex:0 0 22px;width:22px;height:22px;border-radius:50%;
      background:var(--accent);color:#fff;font-size:12px;font-weight:600;
      display:flex;align-items:center;justify-content:center;align-self:center}
.part>.hd h3{font-size:17px;line-height:24px;font-weight:600;margin:0}
.part>.hd em{font-style:normal;font-size:13px;color:var(--ink3);
             margin-inline-start:auto;align-self:center}
.part p.lead{font-size:17px;line-height:29px;margin:10px 0 2px}
.lnk{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;
     padding:8px 0;text-decoration:none;color:inherit;
     border-bottom:1px solid var(--hairline);transition:background .12s}
.lnk:active{background:rgba(0,0,0,.04)}
.lnk:last-of-type{border-bottom:0}
.lnk .ic{flex:0 0 26px;width:26px;height:26px;border-radius:7px;display:flex;
     align-items:center;justify-content:center;font-size:11px;color:#fff;
     background:var(--ink3);font-weight:600}
.lnk .ic.v{background:#C8342B;border-radius:50%;font-size:9px;padding-inline-start:1px}
.lnk .ic.d{background:var(--teal)}
.lnk .ic.m{background:var(--navy)}
.lnk .ic.b{background:var(--green)}
.lnk .tt{flex:1;min-width:0}
.lnk .tt b{display:block;font-size:16px;font-weight:500;line-height:22px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .tt span{font-size:13px;line-height:19px;color:var(--ink2)}
.lnk .tt span i{font-style:normal;color:var(--ink3)}
.lnk .chev{color:var(--ink3);flex:0 0 auto}
.lnk .chev svg{width:9px;height:15px;display:block}
.more{display:block;width:100%;text-align:start;padding:12px 0 0;font-size:15px;
      color:var(--accent-ink);background:none;border:0;font:inherit;font-size:15px}
.srch.top{padding:0 var(--inset) 4px}
/* טופס הדיווח */
.rf label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.rf .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0}
.rf .chip{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--hairline);background:var(--sunken);color:var(--ink2);cursor:pointer}
.rf .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rf textarea,.rf input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;
  border:1px solid var(--hairline);border-radius:10px;padding:10px 12px;background:var(--sunken);
  color:var(--ink);resize:vertical}
.rf textarea{min-height:92px;line-height:24px}
.rf textarea:focus,.rf input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff}
.rf .err{color:var(--warn);font-size:14px;line-height:21px;margin:10px 0 0}
.rf .ok{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 6px;text-align:center}
.rf .ok .vee{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px}
.rf .ok p{margin:0;font-size:16px;line-height:24px;color:var(--ink)}
.sheet a.go[aria-disabled=true]{opacity:.55}
.ok{color:var(--teal)}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--hairline);
      font-size:13px;line-height:20px;color:var(--ink3)}
.empty{font-size:15px;line-height:24px;color:var(--ink2);padding:0 var(--inset)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="sheet" id="sheet"></div>

/* ================================================== */
const app = document.getElementById('app');
const GRADES = ['ז׳','ח׳','ט׳','י׳','י״א','י״ב'];
const SUBJECTS = [...new Set(DATA.map(t=>t.subject))];
const inSub = s => DATA.filter(t=>t.subject===s);
const MONTHS = ['ספטמבר','אוקטובר','נובמבר','דצמבר','ינואר','פברואר','מרץ','אפריל','מאי','יוני'];
const CHEV_F = '<svg viewBox="0 0 9 15" fill="none"><path d="M7.5 1 1.5 7.5 7.5 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV_B = '<svg viewBox="0 0 11 18" fill="none"><path d="M2 1.5 9 9l-7 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const RXM = /[A-Za-z][A-Za-z0-9._-]*(?:\s+[A-Za-z0-9._-]+)*|[0-9][0-9\u00b0%\u2013\-.,\/]*[0-9\u00b0%]|[0-9]+%?/g;
const iso = s => esc(s).split(/(&(?:amp|lt|gt|quot);)/)
  .map((seg,i)=> i%2 ? seg : seg.replace(RXM, m=>'<span class="m">'+m+'</span>')).join('');
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mathy = iso;

const norm = s => (s||'').replace(/["'\u05f3\u05f4\u2019\u201c\u201d.,()\-\u2013\u2014]/g,'')
                        .replace(/\s+/g,' ').trim();
const HAY = t => norm([t.topic,t.alt,t.domain,t.subject,t.grade,t.level].join(' '));
function findAll(q){
  const n = norm(q); if (n.length < 2) return [];
  const ws = n.split(' ').filter(Boolean);
  return DATA.filter(t => ws.every(w => HAY(t).includes(w))).slice(0,60);
}
let view = {v:'subjects'};
const levelsFor = (s,g) => [...new Set(DATA.filter(t=>t.subject===s&&t.grade===g).map(t=>t.level))];
const gradesFor = s => [...new Set(inSub(s).map(t=>t.grade))];
const monthKey = w => { const i = MONTHS.findIndex(m => (w||'').startsWith(m)); return i<0 ? 99 : i; };

function go(v, push=true){
  view = v;
  if (push) history.pushState(v, '');
  render();
  window.scrollTo(0,0);
}
window.onpopstate = e => { view = e.state || {v:'subjects'}; render(); };

const attr = s => s.replace(/"/g,'&quot;');
function nav(title, back){
  if(!back && !title) return '';
  return '<nav>' + (back
    ? '<button class="back" onclick="go('+attr(JSON.stringify(back))+')">'+CHEV_B+'חזרה</button>'
    : '') + '<div class="t">'+esc(title)+'</div>'
    + '<img class="lgm" src="data:image/png;base64,'+LOGO+'" alt=""></nav>';
}
function row(p1, p2, onclick, opts={}){
  return '<button class="row"'+(opts.dis?' disabled':'')+(onclick?' onclick="'+attr(onclick)+'"':'')+'>'
    +'<span class="tx"><span class="p1">'+(opts.dot?'<i class="dot"></i>':'')+p1+'</span>'
    +(p2?'<span class="p2">'+p2+'</span>':'')+'</span>'
    +(opts.dis?'':'<span class="chev">'+CHEV_F+'</span>')+'</button>';
}

function subjects(){
  return '<div class="hero"><img src="data:image/png;base64,'+LOGO+'" alt="עתיד פלוס">'
   + '<h1>חומרי למידה</h1>'
   + '<p>תכניות לימודים, סרטוני הסבר, דפי תרגול בכל נושא</p></div>'
   + '<div class="srch top"><input type="search" id="gq" placeholder="חיפוש נושא בכל השכבות" '
   + 'value="'+esc(view.gq||'')+'" oninput="view.gq=this.value;'
   + 'document.getElementById(&quot;glist&quot;).innerHTML=globalHTML();"></div>'
   + '<div id="glist">'+globalHTML()+'</div>'
   + '<div class="list"'+((view.gq||'').trim().length>1?' style="display:none"':'')+'>'
   + SUBJECTS.map(s=>{
       const n=inSub(s).length, gs=gradesFor(s);
       return row(esc(s), n+' נושאים · '+esc(gs[0])+'–'+esc(gs[gs.length-1]),
         "go({v:'grades',s:'"+s+"'})");
     }).join('')
   + '</div>';
}

function globalHTML(){
  const q = (view.gq||'').trim();
  if (q.length < 2) return '';
  const res = findAll(q);
  if (!res.length) return '<div class="empty" style="padding:16px 20px">'
    + 'לא נמצא נושא מתאים. אפשר לנסות מילה אחת — למשל "פרבולה" או "טרפז".</div>';
  let out = '<div class="sect"><b>תוצאות</b><span>'+res.length+'</span></div><div class="list">';
  res.forEach(t=>{
    const lv = t.level.includes('כלל') ? '' : ' · ' + t.level.replace(/\s*\(.*\)$/,'');
    const n = (t.parts ? (t.parts['תרגול']||[]).length : 0) + (t.geva?1:0);
    out += row(iso(t.topic), esc(t.subject+' · '+t.grade+lv)
      + (n?' · <span class="ok">'+n+' חומרי תרגול</span>':''),
      "go({v:'card',id:'"+t.id+"'})");
  });
  return out + '</div>';
}

function grades(){
  const s = view.s;
  let h = nav('', {v:'subjects'}) + '<div class="lg"><h1>'+esc(s)+'</h1><p>בחרו שכבה</p></div><div class="list">';
  gradesFor(s).forEach(g=>{
    const n = DATA.filter(t=>t.subject===s&&t.grade===g).length;
    const lv = levelsFor(s,g);
    const sub = lv.length>1 ? lv.length+' מסלולים · '+n+' נושאים' : n+' נושאים';
    h += row(esc(g), sub, "go({v:'topics',s:'"+s+"',g:'"+g+"'})");
  });
  return h + '</div>';
}

function topics(){
  const sb = view.s, g = view.g;
  const lv = levelsFor(sb,g);
  const cur = view.l || lv[0];
  const q = (view.q||'').trim();
  let items = DATA.filter(t=>t.subject===sb && t.grade===g && t.level===cur);
  if (q) items = items.filter(t=>t.topic.includes(q) || t.domain.includes(q));
  items = items.map((t,i)=>({t,i})).sort((a,b)=>{
    const d = monthKey(a.t.when)-monthKey(b.t.when);
    return d || DATA.indexOf(a.t)-DATA.indexOf(b.t);
  });

  let h = nav('', {v:'grades',s:sb}) + '<div class="lg"><h1>'+esc(g)+'</h1><p>'+esc(sb)+'</p></div>';
  if (lv.length>1){
    h += '<div class="chips lvl">' + lv.map(l=>
      '<button class="chip'+(l===cur?' on':'')+'" onclick="go({v:&quot;topics&quot;,s:&quot;'+sb+'&quot;,g:&quot;'+g+'&quot;,l:&quot;'+l+'&quot;})">'
      + esc(l.replace(/\s*\(.*\)/,'')) + '</button>').join('') + '</div>';
  }
  h += '<div class="srch"><input type="search" placeholder="חיפוש נושא" value="'+esc(q)+'" '
    + 'oninput="view.q=this.value;document.getElementById(&quot;lst&quot;).innerHTML=listHTML();"></div>';
  h += '<div class="list" id="lst">'+listHTML(items)+'</div>';
  return h;
}

function listHTML(items){
  if (!items){
    const sb=view.s, g=view.g, cur=view.l||levelsFor(view.s,view.g)[0], q=(view.q||'').trim();
    let a = DATA.filter(t=>t.subject===sb && t.grade===g && t.level===cur);
    if (q) a = a.filter(t=>t.topic.includes(q)||t.domain.includes(q));
    items = a.map(t=>({t})).sort((x,y)=>monthKey(x.t.when)-monthKey(y.t.when)
      || DATA.indexOf(x.t)-DATA.indexOf(y.t));
  }
  if (!items.length) return '<div class="empty" style="padding:16px 20px">לא נמצא נושא מתאים.</div>';
  let out='', byM={};
  items.forEach(({t})=>{ const k=((t.when||'').split('\u2013')[0].trim())||t.domain||'—'; (byM[k]=byM[k]||[]).push(t); });
  Object.keys(byM).sort((a,b)=>monthKey(a)-monthKey(b)).forEach(m=>{
    const arr = byM[m];
    out += '<div class="sect"><b>'+esc(m)+'</b><span>'+arr.length+' נושאים</span></div>';
    arr.forEach(t=>{
      const facts=[]; if(t.hours) facts.push(t.hours+' שעות'); if(t.domain) facts.push(esc(t.domain));
      let p2 = facts.join(' · ');
      if (t.dropped) p2 += (p2?' · ':'')+'<span class="w">הושמט מהבגרות</span>';
      out += row(iso(t.topic), p2, "go({v:'card',id:'"+t.id+"'})", {dot:!!t.dropped});
    });
  });
  return out;
}

function card(){
  const t = DATA.find(x=>x.id===view.id);
  const back = {v:'topics', s:t.subject, g:t.grade, l:t.level, q:view.q};
  const lvl = t.level.includes('כלל') ? '' : t.level.replace(/\s*\(.*\)$/,'');
  const eyebrow = [t.subject, t.grade, lvl].filter(Boolean).join(' · ');
  const meta = [t.domain, t.hours?t.hours+' שעות':'', t.exam?'שאלון '+t.exam:''].filter(Boolean).join(' · ');

  let h = nav('', back) + '<div class="det">';
  if (t.dropped) h += '<div class="eyebrow warn"><i class="dot"></i>הושמט מבחינת הבגרות תשפ״ז</div>';
  h += '<div class="eyebrow">'+esc(eyebrow)+'</div>';
  h += '<h2>'+esc(t.topic)+'</h2>';
  h += '<div class="meta">'+esc(meta)+'</div>';
  if (t.dropped) h += '<p class="subtle">הנושא עדיין נלמד בכיתה, אך אינו נבחן השנה: '+mathy(t.dropped)+'</p>';

  const PT = t.parts || {};
  h += '<section class="part"><div class="hd"><span class="n">1</span>'
     + '<h3>דגשי הוראה</h3><em>מה חשוב להדגיש</em></div>';
  if (t.emph) h += '<p class="lead">'+mathy(t.emph)+'</p>';
  if (t.note) h += '<p class="lead">'+mathy(t.note)+'</p>';
  if (!t.emph && !t.note) h += '<p class="subtle">לנושא הזה עדיין לא נכתבו דגשים.</p>';
  h += linkList(PT['דגשים']||[]) + '</section>';

  h += '<section class="part"><div class="hd"><span class="n">2</span>'
     + '<h3>סרטון או דף הסבר</h3><em>למי שלא מכיר את החומר</em></div>';
  const ex = (PT['הסבר']||[]).slice();
  if (t.vurl) ex.unshift({label:t.vid||'סרטון הסבר', url:t.vurl, kind:'סרטון',
                          site:t.chan||'', from:''});
  h += ex.length ? linkList(ex)
                 : '<p class="subtle">עדיין לא שובץ חומר הסבר לנושא הזה.</p>';
  h += '</section>';

  h += '<section class="part"><div class="hd"><span class="n">3</span>'
     + '<h3>חומרי תרגול</h3><em>לשיעור ולשיעורי בית</em></div>';
  const pr = (PT['תרגול']||[]).slice();
  if (t.geva){
    const gp = t.geva.split(' · ');
    pr.unshift({label:gp[1]||t.geva, url:t.geva_url, kind:'ספר',
                site:'יואל גבע · '+gp[0]+(gp[2]?' · '+gp[2]:''), from:''});
  }
  h += pr.length ? linkList(pr)
                 : '<p class="subtle">עדיין לא שובצו חומרי תרגול לנושא הזה.</p>';
  if (t.geva) h += '<div class="acc">ספרי גבע נפתחים באזור המורים · '
      + (BOOKS_ACCESS_URL
          ? '<a href="'+BOOKS_ACCESS_URL+'" target="_blank" rel="noopener">פרטי כניסה</a>'
          : '<span class="na">פרטי הכניסה טרם הוגדרו</span>') + '</div>';
  const sk = t.grade+'|'+t.level, SH = (typeof SHELVES!=='undefined'?SHELVES:{});
  const sv = t.subject==='מתמטיקה'
    ? (SH[sk] || {books:(BOOKS[t.grade]||[]), exams:[], extra:[]})
    : {books:[], exams:[], extra:[]};
  const btns = [['books','ספרים דיגיטליים'],['exams','מבחני דמה'],
                ['extra','חומרים נוספים לשכבה']]
    .filter(([k])=>(sv[k]||[]).length)
    .map(([k,ttl])=>'<button class="more" onclick="shelf(event,'+attr(JSON.stringify(sk))
        +','+attr(JSON.stringify(k))+')">'+ttl+' \u2014 '+sv[k].length+' \u203a</button>')
    .join('');
  h += btns;
  h += '</section>';

  h += '<a class="rep" href="#" onclick="report(event,'+attr(JSON.stringify(t.id))+')">'
     + 'דיווח על תקלה בנושא הזה<span class="chev">'+CHEV_F+'</span></a>';
  h += '<div class="foot">'+esc(t.when ? (isNaN(+t.when)? t.when : '') : '')+'</div>';
  return h + '</div>';
}

const ICN = {'סרטון':['v','\u25b6'],'מפמ\u05f4ר':['m','מ'],'דף':['d','PDF'],
             'דף הסבר':['d','דף'],'שיעור':['','ש'],'קורס':['','ק'],
             'ספר':['b','\u25a0'],'קישור':['','\u2197']};
function linkList(arr){
  if(!arr || !arr.length) return '';
  return arr.map(x=>{
    const ic = ICN[x.kind]||['','\u2197'];
    const sub = x.sub ? [esc(x.sub)]
              : [x.site, (x.from && x.label.indexOf(x.from)<0)
                  ? '<i>מתוך ' + esc(x.from) + '</i>' : ''].filter(Boolean);
    return '<a class="lnk" href="'+esc(x.url)+'" target="_blank" rel="noopener">'
      + '<span class="ic '+ic[0]+'">'+ic[1]+'</span>'
      + '<span class="tt"><b>'+iso(x.label)+'</b>'
      + (sub.length?'<span>'+sub.map(s=>s.startsWith('<i>')?s:esc(s)).join(' · ')+'</span>':'')
      + '</span><span class="chev">'+CHEV_F+'</span></a>';
  }).join('');
}

const RKINDS = ['קישור שבור','סרטון לא נפתח','לא מתאים לרמה','חסר חומר','אחר'];
let rstate = {kind:'', id:null};

function report(e,id){
  if (e) e.preventDefault();
  rstate = {kind:'', id:id};
  const s = document.getElementById('sheet');
  s.innerHTML = reportHTML(id);
  s.classList.add('on');
  s.onclick = ev => { if (ev.target === s) s.classList.remove('on'); };
}

function rctx(t){
  const lvl = t.level.includes('כלל') ? '' : ' · ' + t.level.replace(/\s*\(.*\)$/,'');
  return t.topic + ' · ' + t.subject + ' · ' + t.grade + lvl;
}

function reportHTML(id){
  const t = DATA.find(x=>x.id===id);
  return '<div class="bx rf"><h4>דיווח על תקלה</h4>'
   + '<p>' + esc(rctx(t)) + '</p>'
   + '<label>מה הבעיה?</label><div class="chips">'
   + RKINDS.map(k=>'<button type="button" class="chip'+(rstate.kind===k?' on':'')+'" '
       + 'onclick="rstate.kind='+attr(JSON.stringify(k))+';'
       + 'document.getElementById(&quot;sheet&quot;).innerHTML=reportHTML('+attr(JSON.stringify(id))+');'
       + 'document.getElementById(&quot;rtxt&quot;).value=window.__rtxt||&quot;&quot;;">'+esc(k)+'</button>').join('')
   + '</div>'
   + '<label for="rtxt">פירוט</label>'
   + '<textarea id="rtxt" placeholder="איזה קישור, ומה קרה כשלחצת עליו" '
   + 'oninput="window.__rtxt=this.value"></textarea>'
   + '<label for="rwho">מי מדווח (לא חובה)</label>'
   + '<input type="text" id="rwho" placeholder="שם ומרכז" value="'+esc(window.__rwho||'')+'" '
   + 'oninput="window.__rwho=this.value">'
   + '<div id="rmsg"></div>'
   + '<a class="go" id="rsend" href="#" onclick="sendReport(event,'+attr(JSON.stringify(id))+')">שליחה</a>'
   + '<button class="cl" onclick="closeSheet()">ביטול</button></div>';
}

function closeSheet(){
  window.__rtxt=''; window.__rwho=window.__rwho||'';
  document.getElementById('sheet').classList.remove('on');
}

function sendReport(e,id){
  e.preventDefault();
  const t = DATA.find(x=>x.id===id);
  const txt = (document.getElementById('rtxt')||{}).value || '';
  const who = (document.getElementById('rwho')||{}).value || '';
  const msg = document.getElementById('rmsg');
  if (!rstate.kind && txt.trim().length < 3){
    msg.innerHTML = '<p class="err">צריך לבחור מה הבעיה או לכתוב פירוט.</p>';
    return;
  }
  const btn = document.getElementById('rsend');
  btn.textContent = 'שולח…'; btn.setAttribute('aria-disabled','true');
  btn.onclick = ev => ev.preventDefault();
  msg.innerHTML = '';
  const body = {
    _subject: 'דיווח תקלה — ' + t.topic,
    _captcha: 'false',
    _template: 'table',
    'נושא': t.topic,
    'מקצוע': t.subject,
    'שכבה': t.grade,
    'רמה': t.level,
    'סוג התקלה': rstate.kind || '(לא נבחר)',
    'פירוט': txt || '(ללא)',
    'מדווח': who || '(לא צוין)',
    'מזהה': t.id
  };
  fetch(REPORT_API, {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify(body)
  }).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(()=>{
      document.getElementById('sheet').innerHTML =
        '<div class="bx rf"><div class="ok"><span class="vee">\u2713</span>'
        + '<p>הדיווח נשלח. תודה —<br>נטפל בזה ונעדכן את החומר.</p></div>'
        + '<button class="cl" onclick="closeSheet()">סגירה</button></div>';
      window.__rtxt='';
    })
    .catch(()=>{
      const mail = 'mailto:' + REPORT_MAIL
        + '?subject=' + encodeURIComponent('דיווח תקלה — ' + t.topic)
        + '&body=' + encodeURIComponent(
            'נושא: ' + rctx(t) + '\nסוג: ' + (rstate.kind||'') +
            '\n\n' + txt + '\n\nמדווח: ' + who + '\n(מזהה: ' + t.id + ')');
      msg.innerHTML = '<p class="err">השליחה לא עברה — אולי אין רשת כרגע. '
        + 'אפשר לשלוח את זה במייל במקום.</p>';
      btn.textContent = 'שליחה במייל';
      btn.removeAttribute('aria-disabled');
      btn.setAttribute('href', mail);
      btn.onclick = null;
    });
}

const SHTITLE = {books:'ספרים דיגיטליים', exams:'מבחני דמה',
                 extra:'חומרים נוספים לשכבה', global:'מאגרים כלליים לתיכון'};
function shelf(e,key,which){
  e.preventDefault();
  const arr = which==='global' ? GLOBALS
            : (((typeof SHELVES!=='undefined'&&SHELVES[key])||{books:BOOKS[key.split('|')[0]]||[]})[which]||[]);
  const s = document.getElementById('sheet');
  s.innerHTML = '<div class="bx"><h4>'+esc(SHTITLE[which]||'חומרים')
    + (which==='global'?'':' \u2014 '+esc(key.replace('|',' \u00b7 ')))+'</h4>'
    + '<div style="max-height:52vh;overflow:auto;margin-bottom:12px">'
    + arr.map(b=>'<a class="lnk" href="'+esc(b.url)+'" target="_blank" rel="noopener">'
        + '<span class="ic b">\u25a0</span><span class="tt"><b>'+esc(b.label)+'</b></span>'
        + '<span class="chev">'+CHEV_F+'</span></a>').join('')
    + '</div>'
    + '<button class="cl" onclick="document.getElementById(\'sheet\').classList.remove(\'on\')">סגירה</button></div>';
  s.classList.add('on');
  s.onclick = ev => { if (ev.target === s) s.classList.remove('on'); };
}

function render(){
  app.innerHTML = view.v==='subjects' ? subjects()
    : view.v==='grades' ? grades()
    : view.v==='topics' ? topics()
    : card();
}
history.replaceState(view,'');
render();
</script>
</body>
</html>
